[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skynet-local-ai"
version = "0.13.0"
description = "Sovereign local-first personal AI with conversation-first French desktop UX, streaming fast chat, governed agent escalation, female premium voice, persistent memory, tools, automation and resilience"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "SKYNET Project"}]
dependencies = [
    "PySide6>=6.8,<7",
]

[project.scripts]
skynet = "skynet.cli:main"
skynet-desktop = "skynet.desktop_chat_launch:main"
skynet-desktop-command = "skynet.desktop_qt:main"
skynet-desktop-hud = "skynet.desktop_premium:main"
skynet-desktop-classic = "skynet.desktop:main"
skynet-worker = "skynet.worker:main"
skynet-evolve = "skynet.evolve_cli:main"
skynet-supervisor = "skynet.supervisor_cli:main"
skynet-trust = "skynet.trust_cli:main"
skynet-admin = "skynet.admin_cli:main"
skynet-channel = "skynet.channel_server:main"
skynet-sim = "skynet.sim_cli:main"
skynet-voice = "skynet.voice_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]