[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skynet-local-ai"
version = "0.9.0"
description = "Sovereign local-first personal AI with product-grade sessions, integrations, browser, skills, multi-agent orchestration and resilience"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "SKYNET Project"}]
dependencies = []

[project.scripts]
skynet = "skynet.cli:main"
skynet-desktop = "skynet.desktop:main"
skynet-worker = "skynet.worker:main"
skynet-evolve = "skynet.evolve_cli:main"
skynet-supervisor = "skynet.supervisor_cli:main"
skynet-trust = "skynet.trust_cli:main"
skynet-admin = "skynet.admin_cli:main"
skynet-channel = "skynet.channel_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
