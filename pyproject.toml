[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skynet-local-ai"
version = "0.3.0"
description = "Sovereign local-first personal AI operating layer for Windows"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "SKYNET Project"}]
dependencies = []

[project.scripts]
skynet = "skynet.cli:main"
skynet-desktop = "skynet.desktop:main"
skynet-worker = "skynet.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
