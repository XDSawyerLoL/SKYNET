name: portable-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/skynet/**'
      - 'portable_main.py'
      - 'build-portable.ps1'
      - 'pyproject.toml'
      - '.github/workflows/build-portable.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[portable]'

      - name: Tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build one-file EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name 'SKYNET-Portable' `
            --paths '.\src' `
            --collect-submodules 'skynet' `
            --add-data 'src\skynet\voice_worker.py;skynet' `
            .\portable_main.py

      - name: Validate artifact
        shell: pwsh
        run: |
          if (-not (Test-Path '.\dist\SKYNET-Portable.exe')) { throw 'Portable EXE missing' }
          $file = Get-Item '.\dist\SKYNET-Portable.exe'
          if ($file.Length -lt 10MB) { throw "Portable EXE unexpectedly small: $($file.Length) bytes" }
          Write-Host "Size MB: $([math]::Round($file.Length / 1MB, 1))"
          Get-FileHash '.\dist\SKYNET-Portable.exe' -Algorithm SHA256

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: SKYNET-Portable-Windows-x64
          path: dist/SKYNET-Portable.exe
          if-no-files-found: error
          retention-days: 14
