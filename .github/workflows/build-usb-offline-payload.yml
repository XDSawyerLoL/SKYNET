name: usb-offline-payload

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-usb-offline-payload.yml'
      - 'prepare-usb-offline.ps1'

jobs:
  payload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download llama.cpp engines and licenses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/licenses
          curl -L --fail --retry 5 -o payload/llama-cpu.zip https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-win-cpu-x64.zip
          curl -L --fail --retry 5 -o payload/llama-vulkan.zip https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-win-vulkan-x64.zip
          curl -L --fail --retry 5 -o payload/licenses/llama.cpp-MIT.txt https://raw.githubusercontent.com/ggml-org/llama.cpp/b10621/LICENSE
          curl -L --fail --retry 5 -o payload/licenses/Qwen3-Apache-2.0.txt https://huggingface.co/Qwen/Qwen3-4B-GGUF/raw/main/LICENSE

      - name: Download and verify Qwen3-4B Q4_K_M
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 -o Qwen3-4B-Q4_K_M.gguf 'https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf?download=true'
          echo '7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5  Qwen3-4B-Q4_K_M.gguf' | sha256sum -c -
          test "$(stat -c%s Qwen3-4B-Q4_K_M.gguf)" = '2497280256'

      - name: Split model into transport-safe chunks
        shell: bash
        run: |
          set -euo pipefail
          split -b 450M -d -a 2 Qwen3-4B-Q4_K_M.gguf payload/Qwen3-4B-Q4_K_M.gguf.part.
          ls -lh payload/Qwen3-4B-Q4_K_M.gguf.part.*
          test -f payload/Qwen3-4B-Q4_K_M.gguf.part.00
          test -f payload/Qwen3-4B-Q4_K_M.gguf.part.05

      - name: Upload engines
        uses: actions/upload-artifact@v4
        with:
          name: SKYNET-USB-OFFLINE-ENGINES
          path: |
            payload/llama-cpu.zip
            payload/llama-vulkan.zip
            payload/licenses/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload model part 00
        uses: actions/upload-artifact@v4
        with:
          name: SKYNET-USB-MODEL-PART-00
          path: payload/Qwen3-4B-Q4_K_M.gguf.part.00
          compression-level: 0
          retention-days: 14
      - name: Upload model part 01
        uses: actions/upload-artifact@v4
        with:
          name: SKYNET-USB-MODEL-PART-01
          path: payload/Qwen3-4B-Q4_K_M.gguf.part.01
          compression-level: 0
          retention-days: 14
      - name: Upload model part 02
        uses: actions/upload-artifact@v4
        with:
          name: SKYNET-USB-MODEL-PART-02
          path: payload/Qwen3-4B-Q4_K_M.gguf.part.02
          compression-level: 0
          retention-days: 14
      - name: Upload model part 03
        uses: actions/upload-artifact@v4
        with:
          name: SKYNET-USB-MODEL-PART-03
          path: payload/Qwen3-4B-Q4_K_M.gguf.part.03
          compression-level: 0
          retention-days: 14
      - name: Upload model part 04
        uses: actions/upload-artifact@v4
        with:
          name: SKYNET-USB-MODEL-PART-04
          path: payload/Qwen3-4B-Q4_K_M.gguf.part.04
          compression-level: 0
          retention-days: 14
      - name: Upload model part 05
        uses: actions/upload-artifact@v4
        with:
          name: SKYNET-USB-MODEL-PART-05
          path: payload/Qwen3-4B-Q4_K_M.gguf.part.05
          compression-level: 0
          retention-days: 14
