name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Accelerated reality soak — 1000 virtual hours
        run: python -m skynet.sim_cli --root . core --episodes 1000 --workers 8 --seed 8196 --virtual-minutes 60 --strict
