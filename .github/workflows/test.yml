name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: High-speed governance fuzz — 100000 cases
        run: python -m skynet.sim_cli --root . fuzz --cases 100000 --seed 8196 --strict
      - name: Deep reality soak — 1024 virtual hours
        run: python -m skynet.sim_cli --root . core --episodes 256 --workers 8 --seed 8196 --virtual-minutes 240 --strict
